<div class="aurora" aria-hidden="true"></div>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="topbar glass">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-ball" aria-hidden="true"></span>
    <span class="brand-text gradient-text">PokéVerse</span>
    <span class="brand-sub">Arena</span>
  </a>

  <button
    class="burger"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
  >
    <span></span><span></span><span></span>
  </button>

  <nav class="nav" [class.open]="menuOpen()">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span class="nav-icon" aria-hidden="true"><pv-icon [name]="item.icon" /></span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</header>

<main class="content" id="main-content" tabindex="-1">
  <router-outlet />
</main>

<footer class="footer">
  <span>
    Data from
    <a href="https://pokeapi.co" target="_blank" rel="noopener noreferrer">PokéAPI</a>
    · Fan project · Built with Angular 22, PixiJS &amp; Three.js
  </span>
  <a
    class="version"
    href="https://github.com/C0deWiz4rd010/pokeverse-arena"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="View source on GitHub"
  >v{{ version }}</a>
</footer>
