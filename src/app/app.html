<div class="aurora" aria-hidden="true"></div>

<header class="topbar glass">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-ball" aria-hidden="true"></span>
    <span class="brand-text gradient-text">PokéVerse</span>
    <span class="brand-sub">Arena</span>
  </a>

  <button
    class="burger"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
  >
    <span></span><span></span><span></span>
  </button>

  <nav class="nav" [class.open]="menuOpen()">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="footer">
  <span>
    Data from
    <a href="https://pokeapi.co" target="_blank" rel="noopener noreferrer">PokéAPI</a>
    · Fan project · Built with Angular 22, PixiJS &amp; Three.js
  </span>
</footer>
