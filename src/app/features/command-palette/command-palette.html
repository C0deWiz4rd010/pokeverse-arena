@if (open()) {
  <div class="cmd-backdrop" role="presentation" (click)="onBackdrop($event)">
    <div
      class="cmd-panel glass"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'Command palette' | t"
      pvModal
      (pvModalClose)="close()"
    >
      <label class="cmd-search">
        <pv-icon name="search" />
        <input
          #queryInput
          type="text"
          role="combobox"
          aria-expanded="true"
          aria-controls="cmd-list"
          [attr.aria-activedescendant]="flat().length ? 'cmd-opt-' + selected() : null"
          [attr.placeholder]="'Search pages, actions or Pokémon…' | t"
          autocomplete="off"
          spellcheck="false"
          [value]="query()"
          (input)="onInput($event)"
          (keydown)="onKeydown($event)"
        />
        <kbd>{{ 'Esc' | t }}</kbd>
      </label>

      <div class="cmd-list" id="cmd-list" role="listbox" [attr.aria-label]="'Results' | t">
        @for (group of groups(); track group.title) {
          <p class="cmd-group">{{ group.title | t }}</p>
          @for (item of group.items; track item.key) {
            <button
              type="button"
              class="cmd-item"
              role="option"
              tabindex="-1"
              [id]="'cmd-opt-' + indexOf(item)"
              [class.active]="indexOf(item) === selected()"
              [attr.aria-selected]="indexOf(item) === selected()"
              (pointermove)="hover(item)"
              (click)="execute(item)"
            >
              @if (item.sprite) {
                <img decoding="async" class="cmd-sprite" [src]="item.sprite" alt="" loading="lazy" width="40" height="40" />
              } @else if (item.icon) {
                <span class="cmd-icon" aria-hidden="true"><pv-icon [name]="item.icon" /></span>
              }
              <span class="cmd-label">{{ item.label | t }}</span>
              @if (item.hint) {
                <span class="cmd-hint">{{ item.hint | t }}</span>
              }
              <span class="cmd-go" aria-hidden="true">↵</span>
            </button>
          }
        } @empty {
          <p class="cmd-empty">{{ 'No matches — try a Pokémon name or “arena”.' | t }}</p>
        }
      </div>

      <footer class="cmd-foot" aria-hidden="true">
        <span><kbd>↑</kbd><kbd>↓</kbd> {{ 'navigate' | t }}</span>
        <span><kbd>↵</kbd> {{ 'open' | t }}</span>
        <span><kbd>{{ 'Esc' | t }}</kbd> {{ 'close' | t }}</span>
      </footer>
    </div>
  </div>
}
