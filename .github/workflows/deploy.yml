name: Deploy to GitHub Pages

# Build the production bundle and publish it to GitHub Pages.
# Hash routing (withHashLocation) means deep links work without server rewrites;
# the 404.html fallback covers any non-hash path that is requested directly.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app + specs)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Translations complete
        run: npm run i18n:check
      - name: Unit tests
        run: npm run test:ci
      - name: Dependency audit (production, non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  lighthouse:
    name: Lighthouse (mobile, informational)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production, scoped base href)
        run: npm run build -- --base-href=/pokeverse-arena/

      - name: SPA + Pages housekeeping
        run: |
          cp dist/pokeverse-arena/browser/index.html dist/pokeverse-arena/browser/404.html
          touch dist/pokeverse-arena/browser/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pokeverse-arena/browser

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
